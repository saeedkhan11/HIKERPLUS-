services:
  db:
    image: supabase/postgres:15.8.1.060
    restart: on-failure
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  set-search-path:
    image: supabase/postgres:15.8.1.060
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: postgres
    command: ["sh", "-c", "psql -h db -U postgres -c \"CREATE SCHEMA IF NOT EXISTS auth;\" && psql -h db -U postgres -c \"ALTER ROLE postgres IN DATABASE postgres SET search_path TO auth, public, extensions;\" && echo 'Search path set at role level'"]
    restart: "no"

  auth:
    image: supabase/gotrue:v2.164.0
    restart: on-failure
    depends_on:
      set-search-path:
        condition: service_completed_successfully
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://postgres:postgres@db:5432/postgres
      GOTRUE_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
      GOTRUE_JWT_EXP: 86400
      GOTRUE_JWT_DEFAULT_GROUP: authenticated
      GOTRUE_SITE_URL: https://3000-${BASE44_PUBLIC_HOST_SUFFIX}
      API_EXTERNAL_URL: https://8000-${BASE44_PUBLIC_HOST_SUFFIX}
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_DISABLE_SIGNUP: "false"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9999/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 15s

  migrate:
    image: postgres:15-alpine
    depends_on:
      auth:
        condition: service_healthy
    environment:
      PGPASSWORD: postgres
    volumes:
      - ./supabase/migrations:/migrations:ro
    command: ["sh", "-c", "until psql -h db -U postgres -c 'SELECT 1 FROM auth.users LIMIT 1' 2>/dev/null; do echo 'Waiting for auth schema...'; sleep 2; done && if psql -h db -U postgres -tAc \"SELECT 1 FROM information_schema.tables WHERE table_schema='public' AND table_name='workspace_members'\" | grep -q 1; then echo 'Schema already migrated, skipping initial'; else psql -h db -U postgres -v ON_ERROR_STOP=1 -c 'SET search_path TO public;' -f /migrations/0001_initial_schema.sql && echo 'Initial migration complete'; fi && psql -h db -U postgres -v ON_ERROR_STOP=1 -c 'SET search_path TO public;' -f /migrations/0002_upgrade_schema.sql && echo 'Upgrade migration complete'"]
    restart: "no"

  rest:
    image: postgrest/postgrest:v12.2.3
    restart: on-failure
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      PGRST_DB_URI: postgres://postgres:postgres@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
      PGRST_JWT_ROLE_CLAIM_KEY: '."https://supabase.io/role"'
      PGRST_CORS_ALLOWED_ORIGINS: "*"
    # PostgREST v12 image is distroless (no shell/wget); proxy healthcheck covers API health
    healthcheck:
      disable: true

  proxy:
    image: nginx:alpine
    restart: on-failure
    depends_on:
      rest:
        condition: service_started
      auth:
        condition: service_healthy
    ports:
      - "8000:80"
    volumes:
      - ./nginx/base44.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -T 2 -q -O /dev/null http://127.0.0.1:80/health || { echo 'Proxy health failed'; exit 1; };
          wget -T 2 -q -O /dev/null http://127.0.0.1:80/auth/v1/health || { echo 'Auth health failed'; exit 1; };
          wget -T 2 -q -O /dev/null http://127.0.0.1:80/rest/v1/ || { echo 'REST health failed'; exit 1; }
      interval: 5s
      timeout: 8s
      retries: 10
      start_period: 10s

  web:
    image: node:22-alpine
    restart: on-failure
    depends_on:
      proxy:
        condition: service_healthy
    ports:
      - "3000:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    environment:
      - BASE44_PREVIEW_MODE
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - BASE44_PUBLIC_HOST_SUFFIX
    command: ["sh", "-ec", "if [ -z \"$$VITE_SUPABASE_URL\" ]; then export VITE_SUPABASE_URL=\"https://3000-${BASE44_PUBLIC_HOST_SUFFIX}\"; fi && cd /app && npm ci --no-audit --no-fund && exec npm run dev -- --host 0.0.0.0"]
    healthcheck:
      test: ["CMD-SHELL", "wget -T 3 -q -O /dev/null http://127.0.0.1:5173/ || { echo 'Frontend health failed'; exit 1; }"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s

volumes:
  pgdata:
